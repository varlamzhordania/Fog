# Production stack. Run with:  make prod-up
# Keeps the project name "fog" so existing volumes (pgdata, media, ...) are reused.
name: fog

x-backend: &backend
  build: ./backend
  image: fog-backend:prod
  env_file: env/prod/backend.env
  environment:
    DJANGO_DEBUG: "False"
    DJANGO_ENV: "prod"
    DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?set SITE_DOMAIN in env/prod/compose.env},backend,localhost
    SERVER_DOMAIN: ${SITE_DOMAIN}
    FRONTEND_DOMAIN: ${SITE_DOMAIN}
    DB_ENGINE: postgresql
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in env/prod/compose.env}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    REDIS_HOST: redis://redis:6379/2
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in env/prod/compose.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  backend:
    <<: *backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application -b 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    expose: ["8000"]
    volumes: [media:/home/app/media, static:/home/app/staticfiles]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  celery:
    <<: *backend
    depends_on:
      backend: {condition: service_healthy}
    command: celery -A core worker -l info -Q celery,emails -c 4

  celery-beat:
    <<: *backend
    depends_on:
      backend: {condition: service_healthy}
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      args:   # baked in at build time
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL in env/prod/compose.env}
        NEXT_PUBLIC_MEDIA_BASE_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_RESEARCH_URL: https://fleshofgod.org
    image: fog-frontend:prod
    env_file: env/prod/frontend.env
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
    expose: ["3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/zones.conf:/etc/nginx/conf.d/00-zones.conf:ro
      - ./nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes: {pgdata: {}, redisdata: {}, media: {}, static: {}}
