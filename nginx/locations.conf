client_max_body_size 16m;     # Media model allows 15 MB

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # not appended: the client can't spoof it
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;

# SHKeeper calls this over the docker network only
location = /api/v1/checkout/webhooks/shkeeper/ { return 404; }

location ^~ /api/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://app_backend;
}

# API docs: public in dev, remove this block if you want them reachable
location ^~ /api/schema/ { return 404; }

location ^~ /admin/ {
    limit_req zone=admin burst=40 nodelay;
    # allow 203.0.113.10;  # your office/VPN
    # deny all;
    proxy_pass http://app_backend;
}

location ^~ /ckeditor5/     { proxy_pass http://app_backend; }
location ^~ /_nested_admin/ { proxy_pass http://app_backend; }
location ^~ /setlang/       { proxy_pass http://app_backend; }

location ^~ /static/ { alias /srv/static/; expires 30d; access_log off; }
location ^~ /media/  { alias /srv/media/;  expires 7d; }

# Next route handlers that touch credentials
location ~ ^/api/auth/(login|register|password-reset)/?$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://app_frontend;
}

location / { proxy_pass http://app_frontend; }