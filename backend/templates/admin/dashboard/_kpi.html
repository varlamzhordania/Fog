<article class="dash-card flex flex-col justify-between p-5">
    <span class="text-sm text-slate-500 dark:text-slate-400">{{ label }}</span>
    <span class="mt-3 text-3xl font-semibold tabular-nums text-slate-900 dark:text-white">{{ value }}</span>
    <span class="mt-1 text-xs text-slate-500">
        <b class="font-semibold {% if delta.tone == 'up' %}text-emerald-500{% elif delta.tone == 'down' %}text-rose-500{% endif %}">{{ delta.text }}</b>
        {{ note }}
    </span>
</article>
